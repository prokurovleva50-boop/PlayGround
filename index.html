<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#85c9dc;color:var(--cream);font-family:'Roboto Mono',monospace;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(13,36,64,.12),transparent 25%,transparent 72%,rgba(9,24,34,.34))}.topbar{position:fixed;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand,.daybox,.objective,.stats,.hotbar,.hint,.panel,.touch{pointer-events:auto}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;background:#ffca58;border:3px solid #fff0bd;box-shadow:4px 4px 0 #915d44;display:grid;place-items:center;font-size:23px;color:#29445b}.brand h1{font:20px 'Russo One',sans-serif;letter-spacing:.5px;margin:0;text-shadow:2px 3px #38506a}.brand small{display:block;color:#f8e9be;font-size:9px;letter-spacing:2px;margin-top:3px}.daybox{background:#173049dd;border:2px solid #b6e4d8;padding:9px 14px;box-shadow:4px 4px 0 #18334d66;text-align:right;font-size:11px;line-height:1.55}.daybox b{color:#ffdc76;font-size:13px}.stats{position:fixed;left:24px;top:91px;display:flex;gap:8px;align-items:center}.health{display:flex;gap:3px;padding:8px 10px;background:#18344dcc;border:2px solid #b6e4d8}.heart{font-size:16px;filter:drop-shadow(1px 2px #723f51)}.heart.off{opacity:.24;filter:grayscale(1)}.stamina{height:12px;width:108px;padding:2px;border:2px solid #b6e4d8;background:#18344dcc}.stamina i{display:block;height:100%;background:#55dfb4;width:100%;transition:width .15s}.objective{position:fixed;right:24px;top:91px;width:210px;padding:11px 13px;background:#18344dcc;border:2px solid #b6e4d8;font-size:10px;line-height:1.65;box-shadow:4px 4px #18344d44}.objective strong{display:block;color:#ffdc76;font:12px 'Russo One';margin-bottom:3px}.objective span{color:#c3dad8}.hotbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:#18344ddd;border:2px solid #c1e6d9;box-shadow:5px 5px #18344d66}.slot{position:relative;width:52px;height:52px;border:2px solid #75979a;background:#27455b;display:grid;place-items:center;color:#fff4d8;font-size:23px;cursor:pointer;transition:transform .12s,border-color .12s}.slot:hover{transform:translateY(-3px)}.slot.active{border:3px solid #ffdc76;background:#426173;box-shadow:0 0 0 2px #f3985a}.slot .key{position:absolute;top:1px;left:4px;font-size:9px;color:#c3d6c9}.slot .count{position:absolute;right:3px;bottom:1px;font-size:10px;text-shadow:1px 1px #17243a}.slot .name{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);font-size:9px;white-space:nowrap;color:#fff4d8;opacity:0;text-shadow:1px 1px #17243a}.slot.active .name{opacity:1}.hint{position:fixed;bottom:26px;left:24px;color:#fff4d8;font-size:9px;line-height:1.7;text-shadow:1px 2px #18344d}.hint b{color:#ffdc76}.toast{position:fixed;top:155px;left:50%;transform:translate(-50%,-12px);padding:9px 16px;background:#173049eF;border:2px solid #ffdc76;color:#fff3d4;font-size:11px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.panel{position:fixed;display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100vw - 32px));padding:20px;background:#18344df2;border:3px solid #b6e4d8;box-shadow:8px 8px #11233799}.panel.open{display:block}.panel h2{font:20px 'Russo One';margin:0 0 5px;color:#ffdc76}.panel p{font-size:10px;color:#c3dad8;margin:0 0 16px}.craftrow{padding:10px 0;border-top:1px solid #52717b;display:flex;justify-content:space-between;align-items:center;font-size:11px}.craftrow button{background:#ffcf62;border:0;padding:8px 10px;font:11px 'Roboto Mono';font-weight:bold;color:#253b4c;cursor:pointer}.craftrow button:disabled{background:#687d7e;color:#b6c4b8;cursor:not-allowed}.close{position:absolute;right:12px;top:10px;border:0;color:#fff4d8;background:none;font-size:20px;cursor:pointer}.touch{display:none;position:fixed;bottom:18px;left:16px;right:16px;justify-content:space-between;align-items:flex-end;pointer-events:none}.touchgroup{display:flex;gap:8px;pointer-events:auto}.touch button{width:48px;height:48px;border:2px solid #d5e8ce;background:#18344dbb;color:white;font-size:20px;border-radius:8px;touch-action:none}.touch button.action{width:57px;height:57px;background:#b5754dcc}.touch button:active{background:#ffcf62;color:#173049}.mobilehide{display:block}
@media(max-width:700px){.topbar{left:12px;right:12px;top:12px}.brand h1{font-size:15px}.logo{width:36px;height:36px;font-size:19px}.daybox{font-size:9px;padding:6px 9px}.stats{left:12px;top:60px}.objective{right:12px;top:60px;width:155px;font-size:8px;padding:8px}.objective strong{font-size:10px}.hotbar{bottom:92px;gap:3px;padding:5px}.slot{width:43px;height:44px;font-size:19px}.hint{display:none}.touch{display:flex}.touch button{width:43px;height:43px}.touch button.action{width:51px;height:51px}.slot .name{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="shade"></div>
<div class="topbar"><div class="brand"><div class="logo">⛏</div><div><h1>ПЫЛЬНЫЕ ЗЕМЛИ</h1><small>ДИКАЯ ГРАНИЦА · 1-Й ДЕНЬ</small></div></div><div class="daybox">ДЕНЬ <b id="day">01</b><br><span id="clock">08:00</span> <span id="weather">☀ ЯСНО</span></div></div>
<div class="stats"><div class="health" id="health"></div><div class="stamina"><i id="stamina"></i></div></div>
<div class="objective"><strong>✦ ПЕРВОЕ УТРО</strong><span>Собери дерево и камень. Построй верстак, чтобы создавать снаряжение.</span></div>
<div class="hotbar" id="hotbar"></div><div class="hint"><b>A D</b> двигаться　<b>SPACE</b> прыгать<br><b>ЛКМ</b> копать / удар　<b>ПКМ</b> поставить<br><b>E</b> рюкзак　<b>1–5</b> выбор слота</div>
<div class="toast" id="toast"></div>
<div class="panel" id="panel"><button class="close" id="close">×</button><h2>РЮКЗАК И РЕМЕСЛО</h2><p>Собирай ресурсы в лесу и готовься к ночи.</p><div id="inventory"></div></div>
<div class="touch"><div class="touchgroup"><button data-key="a">◀</button><button data-key="d">▶</button></div><div class="touchgroup"><button class="action" data-key="jump">↑</button><button class="action" data-key="mine">⛏</button><button class="action" data-key="attack">⚔</button></div></div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const TILE=32,W=180,H=64,world=[],decor=[],enemies=[],particles=[],keys={},inv={dirt:0,wood:0,stone:0,copper:0,gel:0,workbench:0};
let vw=innerWidth,vh=innerHeight,camX=0,camY=0,last=0,time=0,day=1,selected=0,mouse={x:0,y:0,left:false,right:false},mineTarget=null,mineTime=0,toastTimer=0,panelOpen=false;
const items=[{id:'pick',icon:'⛏',name:'Кирка',type:'tool'},{id:'sword',icon:'⚔️',name:'Меч',type:'tool'},{id:'dirt',icon:'🟫',name:'Земля',type:'block'},{id:'wood',icon:'🪵',name:'Дерево',type:'block'},{id:'stone',icon:'🪨',name:'Камень',type:'block'}];
const player={x:15*TILE,y:0,vx:0,vy:0,w:22,h:39,hp:5,maxHp:5,stamina:100,ground:false,facing:1,invuln:0,attack:0};
const rand=(a,b)=>Math.random()*(b-a)+a,ri=(a,b)=>Math.floor(rand(a,b));
function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=vw*d;canvas.height=vh*d;canvas.style.width=vw+'px';canvas.style.height=vh+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function surfaceAt(x){return Math.floor(17+Math.sin(x*.07)*2+Math.sin(x*.021)*2+Math.sin(x*.19)*.55)}
function generate(){for(let x=0;x<W;x++){let s=surfaceAt(x);world[x]=[];for(let y=0;y<H;y++){let id=null;if(y>=s){id=y===s?'grass':y<s+5?'dirt':'stone';if(y>s+7&&Math.random()<.033)id='copper';if(y>s+3&&Math.random()<.025)id='cave';}world[x][y]=id}if(x>2&&x<W-3&&Math.random()<.12){let h=ri(3,6);for(let n=1;n<=h;n++)world[x][s-n]='wood';for(let dx=-2;dx<=2;dx++)for(let dy=-h-2;dy<=-h;dy++)if(Math.abs(dx)+Math.abs(dy+h+1)<4&&world[x+dx]?.[s+dy]===null)world[x+dx][s+dy]='leaf';decor.push({x:x*TILE,y:s*TILE,flower:Math.random()<.55?'🌼':'🌷'})}}for(let x=4;x<W-5;x+=ri(8,15))enemies.push({x:x*TILE,y:surfaceAt(x)*TILE-20,vx:0,vy:0,w:26,h:20,hp:2,alive:true,hop:rand(0,2),type:'slime'})
// A little starter clearing, with a chest-like landmark and campfire.
for(let x=12;x<21;x++)for(let y=surfaceAt(x)-1;y>=surfaceAt(x)-4;y--)world[x][y]=null;
decor.push({x:16*TILE,y:surfaceAt(16)*TILE,flower:'🔥'});
}
generate();player.y=surfaceAt(15)*TILE-player.h-2;
function tile(x,y){return world[x]?.[y]??null}function solid(id){return id&&id!=='leaf'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');toastTimer=2.2}
function addParticle(x,y,color,n=5){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-90,90),vy:rand(-130,20),life:rand(.25,.65),color,size:ri(2,5)})}
function makeSlots(){document.getElementById('hotbar').innerHTML=items.map((it,i)=>`<div class="slot ${i===selected?'active':''}" data-slot="${i}"><span class="key">${i+1}</span>${it.icon}<span class="count">${it.type==='block'?(inv[it.id]||0):''}</span><span class="name">${it.name}</span></div>`).join('')}
function updateHealth(){document.getElementById('health').innerHTML=Array.from({length:player.maxHp},(_,i)=>`<span class="heart ${i>=player.hp?'off':''}">♥</span>`).join('');document.getElementById('stamina').style.width=player.stamina+'%'}makeSlots();updateHealth();
function openBag(){panelOpen=!panelOpen;document.getElementById('panel').classList.toggle('open',panelOpen);refreshBag()}
function refreshBag(){const el=document.getElementById('inventory');const rows=[['Дерево','wood','🪵'],['Земля','dirt','🟫'],['Камень','stone','🪨'],['Медная руда','copper','🟠'],['Слизь','gel','🟢'],['Верстак','workbench','🛠']];el.innerHTML=rows.map(([name,id,icon])=>`<div class="craftrow"><span>${icon} ${name}</span><b>${inv[id]||0}</b></div>`).join('')+`<div class="craftrow"><span>🪚 Верстак <small>(10 дерева)</small></span><button id="craftBench" ${inv.wood<10||inv.workbench?'disabled':''}>${inv.workbench?'СОЗДАН':'СОЗДАТЬ'}</button></div><div class="craftrow"><span>🗡 Железный клинок <small>(5 камня, 3 меди)</small></span><button id="craftSword" ${inv.stone<5||inv.copper<3?'disabled':''}>СОЗДАТЬ</button></div>`;
const bench=document.getElementById('craftBench');if(bench)bench.onclick=()=>{if(inv.wood>=10&&!inv.workbench){inv.wood-=10;inv.workbench=1;toast('Верстак готов!');refreshBag();makeSlots()}};const sword=document.getElementById('craftSword');if(sword)sword.onclick=()=>{if(inv.stone>=5&&inv.copper>=3){inv.stone-=5;inv.copper-=3;items[1].icon='🗡️';items[1].name='Клинок';toast('Клинок выкован!');refreshBag();makeSlots()}}}
document.getElementById('close').onclick=openBag;addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='e'){openBag();e.preventDefault()}if(k==='escape'&&panelOpen)openBag();if(k>='1'&&k<='5'){selected=+k-1;makeSlots()}if(k===' '||k.startsWith('arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('hotbar').addEventListener('click',e=>{const el=e.target.closest('.slot');if(el){selected=+el.dataset.slot;makeSlots()}});
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('mousedown',e=>{if(e.button===0)mouse.left=true;if(e.button===2)mouse.right=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.left=false;if(e.button===2)mouse.right=false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
for(const btn of document.querySelectorAll('.touch button')){const key=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});for(const ev of ['pointerup','pointercancel','pointerleave'])btn.addEventListener(ev,()=>keys[key]=false)}
function targetTile(){if(keys.mine)return{x:Math.floor((player.x+player.w/2+player.facing*38)/TILE),y:Math.floor((player.y+player.h*.55)/TILE)};return{x:Math.floor((mouse.x+camX)/TILE),y:Math.floor((mouse.y+camY)/TILE)}}
function collect(id){if(id==='grass'||id==='dirt')inv.dirt++;else if(id==='wood')inv.wood++;else if(id==='stone')inv.stone++;else if(id==='copper')inv.copper++;else if(id==='leaf'&&Math.random()<.25)inv.wood++;makeSlots();if(panelOpen)refreshBag()}
function damagePlayer(amount){if(player.invuln>0)return;player.hp=Math.max(0,player.hp-amount);player.invuln=1.1;player.vy=-230;updateHealth();if(player.hp<=0){toast('Ты пал… но приключение продолжается');setTimeout(()=>{player.hp=5;player.x=15*TILE;player.y=surfaceAt(15)*TILE-player.h-2;player.vx=player.vy=0;updateHealth()},1100)}}
function update(dt){time+=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById('toast').classList.remove('show')}
const mins=Math.floor((time%180)/180*24*60+8*60),hour=Math.floor(mins/60)%24,minute=mins%60;document.getElementById('clock').textContent=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');document.getElementById('day').textContent=String(1+Math.floor(time/180)).padStart(2,'0');const night=hour<6||hour>19;
if(panelOpen)return;
const left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;let dir=(right?1:0)-(left?1:0);if(dir){player.vx+=dir*1000*dt;player.facing=dir}else player.vx*=Math.pow(.001,dt);player.vx=Math.max(-225,Math.min(225,player.vx));if((keys[' ']||keys.w||keys.arrowup||keys.jump)&&player.ground){player.vy=-420;player.ground=false;keys.jump=false}
player.vy=Math.min(700,player.vy+1000*dt);moveBody(player,dt);player.invuln=Math.max(0,player.invuln-dt);player.attack=Math.max(0,player.attack-dt);player.stamina=Math.min(100,player.stamina+dt*13);
if(mouse.left||keys.mine||keys.attack){const near=(mouse.left||keys.attack)&&enemies.find(e=>e.alive&&Math.abs(e.x+e.w/2-(player.x+player.w/2))<60&&Math.abs(e.y-player.y)<54);if(near&&player.attack<=0){near.hp--;near.vx=player.facing*190;near.vy=-145;player.attack=.32;addParticle(near.x+near.w/2,near.y,'#fff0a0',7);if(near.hp<=0){near.alive=false;inv.gel+=ri(1,3);makeSlots();toast('Слизь побеждена · + слизь')}}else if(mouse.left||keys.mine){const t=targetTile(),dx=(t.x*TILE+16)-(player.x+player.w/2),dy=(t.y*TILE+16)-(player.y+player.h/2);if(Math.hypot(dx,dy)<150){const id=tile(t.x,t.y);if(id&&id!=='cave'){if(!mineTarget||mineTarget.x!==t.x||mineTarget.y!==t.y){mineTarget=t;mineTime=0}mineTime+=dt*(id==='stone'||id==='copper'?.65:1.6);if(mineTime>(id==='stone'||id==='copper'?.8:.48)){collect(id);world[t.x][t.y]=null;addParticle(t.x*TILE+16,t.y*TILE+16,id==='stone'?'#9ca8a3':'#8cbd83',7);mineTime=0;mineTarget=null}}else{mineTarget=null;mineTime=0}}}else if(keys.attack&&player.attack<=0){player.attack=.32}}
if(mouse.right){const t=targetTile(),item=items[selected];if(item.type==='block'&&inv[item.id]>0&&Math.hypot(t.x*TILE+16-player.x, t.y*TILE+16-player.y)<155&&!tile(t.x,t.y)&&!(t.x*TILE<player.x+player.w&&t.x*TILE+TILE>player.x&&t.y*TILE<player.y+player.h&&t.y*TILE+TILE>player.y)){world[t.x][t.y]=item.id;inv[item.id]--;makeSlots();mouse.right=false}}
for(const e of enemies){if(!e.alive)continue;e.hop-=dt;if(e.hop<=0&&Math.abs(player.x-e.x)<260){e.vx=Math.sign(player.x-e.x)*rand(45,90);e.vy=-rand(170,240);e.hop=rand(.8,1.8)}e.vy+=850*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=Math.pow(.08,dt);const floor=surfaceAt(Math.max(0,Math.min(W-1,Math.floor((e.x+e.w/2)/TILE))))*TILE-e.h;if(e.y>floor){e.y=floor;e.vy=0}if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y)damagePlayer(1)}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;if(p.life<=0)particles.splice(i,1)}
camX=Math.max(0,Math.min(W*TILE-vw,player.x+player.w/2-vw/2));camY=Math.max(0,Math.min(H*TILE-vh,player.y+player.h/2-vh*.53));if(camY>H*TILE-vh)camY=H*TILE-vh;
}
function moveBody(o,dt){ o.x+=o.vx*dt;let x1=Math.floor(o.x/TILE),x2=Math.floor((o.x+o.w-1)/TILE),y1=Math.floor(o.y/TILE),y2=Math.floor((o.y+o.h-1)/TILE);for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(solid(tile(x,y))){if(o.vx>0)o.x=x*TILE-o.w;else if(o.vx<0)o.x=(x+1)*TILE;o.vx=0}o.y+=o.vy*dt;o.ground=false;x1=Math.floor(o.x/TILE);x2=Math.floor((o.x+o.w-1)/TILE);y1=Math.floor(o.y/TILE);y2=Math.floor((o.y+o.h-1)/TILE);for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(solid(tile(x,y))){if(o.vy>0){o.y=y*TILE-o.h;o.ground=true}else if(o.vy<0)o.y=(y+1)*TILE;o.vy=0}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawTile(x,y,id){const sx=x*TILE-camX,sy=y*TILE-camY;let base={grass:'#6f9b51',dirt:'#906447',stone:'#78898a',copper:'#b6774d',wood:'#80543a',leaf:'#4b8857',cave:'#283b49'}[id]||'#906447';rect(sx,sy,TILE,TILE,base);if(id==='grass'){rect(sx,sy,TILE,7,'#72b65d');rect(sx,sy+6,TILE,3,'#4e8d50');for(let i=0;i<4;i++){const xx=(x*13+y*7+i*17)%29;rect(sx+xx,sy+12+(i*7)%16,3,3,i%2?'#a77b51':'#7b583d')}}else if(id==='dirt'){for(let i=0;i<5;i++){const xx=(x*19+y*11+i*23)%28,yy=(i*13+x*5)%27;rect(sx+xx,sy+yy,3+(i%2)*2,3,i%2?'#ad7951':'#79543f')}}else if(id==='stone'||id==='copper'){rect(sx+5,sy+6,10,3,id==='copper'?'#d18a52':'#9eacaa');rect(sx+18,sy+17,8,3,id==='copper'?'#d18a52':'#596e73');rect(sx+7,sy+24,4,3,'#647778');if(id==='copper'){rect(sx+12,sy+11,5,5,'#edae62');rect(sx+22,sy+24,4,4,'#e39a55')}}else if(id==='wood'){rect(sx+8,sy,4,TILE,'#a8794b');rect(sx+20,sy,3,TILE,'#684632');rect(sx+5,sy+9,22,2,'#674632')}else if(id==='leaf'){rect(sx+4,sy+6,24,20,'#5e9d63');rect(sx+8,sy+4,8,7,'#79b96a');rect(sx+22,sy+20,5,6,'#3f744d')}}
function drawBackground(){const hour=(8+time/180*24)%24,night=hour<6||hour>19;let t=night?1:Math.max(0,Math.abs(hour-13)/8);const sky=ctx.createLinearGradient(0,0,0,vh);sky.addColorStop(0,night?'#23395e':t>.7?'#e08e78':'#73c8df');sky.addColorStop(.68,night?'#526f82':t>.7?'#f5c18b':'#c6e8d3');sky.addColorStop(1,'#e8c99a');ctx.fillStyle=sky;ctx.fillRect(0,0,vw,vh);
const sunX=vw*(.15+hour/24*.7),sunY=vh*(.21+Math.sin(hour/24*Math.PI)*.07);if(!night){rect(sunX-17,sunY-17,34,34,'#ffe79a');rect(sunX-23,sunY-11,46,22,'#ffe79a')}else{rect(vw*.78,60,24,24,'#f3edc6');rect(vw*.78+7,56,22,24,'#23395e');for(let i=0;i<38;i++){let x=(i*137+31)%vw,y=(i*71+18)%(vh*.58);rect(x,y,2,2,'#fff2c0')}}
for(let layer=0;layer<3;layer++){const base=vh*.53+layer*42;ctx.beginPath();ctx.moveTo(0,vh);for(let x=0;x<=vw+20;x+=20){let wx=x+camX*(.12+layer*.12);ctx.lineTo(x,base+Math.sin(wx*.004+layer)*25+Math.sin(wx*.011)*11)}ctx.lineTo(vw,vh);ctx.closePath();ctx.fillStyle=night?['#405b70','#385969','#2d554e'][layer]:['#87b6a0','#72a77c','#61926b'][layer];ctx.fill()}for(let i=0;i<6;i++){let x=((i*230-time*11)%(vw+130)+vw+130)%(vw+130)-60,y=70+(i*43)%Math.max(80,vh*.32);if(!night){ctx.globalAlpha=.5;rect(x,y,38,7,'#fff5df');rect(x+9,y-5,23,5,'#fff5df');ctx.globalAlpha=1}}}
function drawWorld(){const x0=Math.max(0,Math.floor(camX/TILE)-1),x1=Math.min(W-1,Math.ceil((camX+vw)/TILE)+1),y0=Math.max(0,Math.floor(camY/TILE)-1),y1=Math.min(H-1,Math.ceil((camY+vh)/TILE)+1);for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const id=tile(x,y);if(id&&id!=='cave')drawTile(x,y,id)}
for(const d of decor){const x=d.x-camX,y=d.y-camY;if(x>-20&&x<vw+20&&y>-30&&y<vh+20){if(d.flower==='🔥'){rect(x-9,y-4,18,5,'#77513c');rect(x-3,y-17,7,13,'#ffb84e');rect(x-1,y-12,4,9,'#ff623f');rect(x-14,y,28,4,'#d7c18c')}else{rect(x+3,y-8,3,8,'#45845a');rect(x,y-12,10,8,d.flower==='🌼'?'#efcb56':'#e78094');rect(x+3,y-14,4,4,'#fff3b1')}}}
for(let x=x0;x<=x1;x++){const s=surfaceAt(x),px=x*TILE-camX,py=s*TILE-camY;if(world[x]?.[s]==='grass'&&px>-50&&px<vw+20){ // grass tuft
if(x%3===0){rect(px+6,py-5,3,7,'#598f53');rect(px+11,py-8,3,10,'#78a95b')}if(x%7===1){rect(px+19,py-4,3,6,'#d8b260');rect(px+17,py-6,7,4,'#eccb70')}}}
// mine progress indicator
if((mouse.left||keys.mine)&&mineTarget){const xx=mineTarget.x*TILE-camX,yy=mineTarget.y*TILE-camY;rect(xx+3,yy+3,26,4,'#273b3e');rect(xx+4,yy+4,24*Math.min(1,mineTime/.8),2,'#ffdd72')}}
function drawPlayer(){const x=player.x-camX,y=player.y-camY;if(player.invuln>0&&Math.floor(player.invuln*14)%2)return; // shadow
rect(x-4,y+player.h-2,30,5,'#2c3d3b66');
// boots and tunic, deliberately chunky pixel silhouette
rect(x+3,y+29,7,8,'#56475a');rect(x+13,y+29,7,8,'#56475a');rect(x+1,y+36,10,3,'#382f42');rect(x+12,y+36,10,3,'#382f42');rect(x+3,y+14,17,17,'#d36f52');rect(x+1,y+16,4,13,'#e99561');rect(x+18,y+16,4,12,'#e99561');rect(x+5,y+29,13,3,'#f2bd6d');rect(x+5,y+3,15,13,'#f0bd83');rect(x+3,y+1,19,7,'#684a46');rect(x+2,y+5,5,9,'#684a46');rect(x+15,y+9,2,2,'#273c4d');rect(x+3,y+18,4,9,'#f5cf95');
if(player.attack>0||mouse.left||keys.attack){ctx.save();ctx.translate(x+player.w/2,y+22);ctx.scale(player.facing,1);rect(6,-2,25,4,'#b8d7ce');rect(22,-6,5,12,'#f8dd93');rect(2,-4,6,8,'#79503b');ctx.restore()}}
function drawEnemies(){for(const e of enemies){if(!e.alive)continue;const x=e.x-camX,y=e.y-camY;rect(x+2,y+e.h-1,e.w-4,4,'#2c454566');rect(x+2,y+5,e.w-4,e.h-4,'#72d3a0');rect(x+5,y+2,e.w-10,7,'#72d3a0');rect(x+6,y+9,5,5,'#b3edbd');rect(x+16,y+9,5,5,'#b3edbd');rect(x+8,y+10,2,3,'#24464c');rect(x+18,y+10,2,3,'#24464c');rect(x+10,y+16,7,2,'#377264')}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);rect(p.x-camX,p.y-camY,p.size,p.size,p.color)}ctx.globalAlpha=1}
function frame(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);drawBackground();drawWorld();drawEnemies();drawPlayer();drawParticles();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
